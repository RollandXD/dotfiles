[preview]
max_width  = 1200
max_height = 1800

[manager]
linemode = "size"

# git 插件：显示文件 git 状态
[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

# eza 目录树预览
[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'

# markdown 预览（glow）
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# PDF 预览（pdftoppm 已安装）
[[plugin.prepend_previewers]]
mime = "application/pdf"
run  = "pdf"

# Office 文件预览（office.yazi：只转当前页 + 后台预加载）
[[plugin.prepend_preloaders]]
mime = "application/openxmlformats-officedocument.*"
run  = "office"

[[plugin.prepend_preloaders]]
mime = "application/oasis.opendocument.*"
run  = "office"

[[plugin.prepend_preloaders]]
mime = "application/ms-*"
run  = "office"

[[plugin.prepend_preloaders]]
mime = "application/msword"
run  = "office"

[[plugin.prepend_preloaders]]
name = "*.docx"
run  = "office"

[[plugin.prepend_previewers]]
mime = "application/openxmlformats-officedocument.*"
run  = "office"

[[plugin.prepend_previewers]]
mime = "application/oasis.opendocument.*"
run  = "office"

[[plugin.prepend_previewers]]
mime = "application/ms-*"
run  = "office"

[[plugin.prepend_previewers]]
mime = "application/msword"
run  = "office"

[[plugin.prepend_previewers]]
name = "*.docx"
run  = "office"
