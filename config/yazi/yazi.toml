[preview]
max_width  = 1200
max_height = 1800

[manager]
linemode = "size"

# git 插件：显示文件 git 状态
[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

# eza 目录树预览
[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"'

# markdown 预览（glow）
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# PDF 预览
[[plugin.prepend_previewers]]
mime = "application/pdf"
run  = "pdf"

# Office 文件预览（office.yazi）
# 用 url 匹配更可靠：实际 MIME 带 vnd. 前缀，README 里的 MIME 规则有误
[[plugin.prepend_preloaders]]
url = "*.{docx,xlsx,pptx,odt,ods,odp}"
run = "office"

[[plugin.prepend_preloaders]]
mime = "application/msword"
run  = "office"

[[plugin.prepend_preloaders]]
mime = "application/vnd.ms-*"
run  = "office"

[[plugin.prepend_previewers]]
url = "*.{docx,xlsx,pptx,odt,ods,odp}"
run = "office"

[[plugin.prepend_previewers]]
mime = "application/msword"
run  = "office"

[[plugin.prepend_previewers]]
mime = "application/vnd.ms-*"
run  = "office"
