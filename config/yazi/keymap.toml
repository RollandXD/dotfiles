# Yazi 26.5.6 自定义键位

# reveal in file manager（方便拖拽到浏览器等）
[[mgr.prepend_keymap]]
on   = "<C-y>"
run  = "shell -- /home/rolland/.config/yazi/reveal.sh %h"
desc = "在文件管理器中打开并选中（方便拖拽）"

# l 只进目录，文件不动（用 o 打开文件）
[[mgr.prepend_keymap]]
on   = "l"
run  = "enter"
desc = "进入目录"

# 快速跳转到首字母匹配的文件
[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin jump-to-char"
desc = "跳转到字符"

# 过滤文件（原生：边输边过滤，保留智能大小写，不自动进目录，自己按 l/Enter 进）
[[mgr.prepend_keymap]]
on   = "f"
run  = "filter --smart"
desc = "过滤文件"

# fzf 模糊搜索：键位对齐 shell（Ctrl-T 搜文件 / Alt-C 搜目录），z = 文件+目录一起搜
[[mgr.prepend_keymap]]
on   = "<C-t>"
run  = "plugin fuzzy-nav -- file"
desc = "fzf 搜文件（对齐 shell Ctrl-T）"

[[mgr.prepend_keymap]]
on   = "<A-c>"
run  = "plugin fuzzy-nav -- dir"
desc = "fzf 搜目录（对齐 shell Alt-C）"

[[mgr.prepend_keymap]]
on   = "z"
run  = "plugin fuzzy-nav -- all"
desc = "fzf 搜文件+目录"

# 只显示 git 改动过的文件
[[mgr.prepend_keymap]]
on   = ["g", "c"]
run  = "plugin vcs-files"
desc = "只看 git 改动文件"

# 放大/缩小预览图片
[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "放大预览"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "缩小预览"

# yamb 书签：运行时打/取消/跳转，g 开头
[[mgr.prepend_keymap]]
on   = ["g", "a"]
run  = "plugin yamb -- save"
desc = "打书签（命名）"

[[mgr.prepend_keymap]]
on   = ["g", "j"]
run  = "plugin yamb -- jump_by_key"
desc = "按 key 秒跳书签"

[[mgr.prepend_keymap]]
on   = ["g", "J"]
run  = "plugin yamb -- jump_by_fzf"
desc = "fzf 列表跳转书签"

[[mgr.prepend_keymap]]
on   = ["g", "x"]
run  = "plugin yamb -- delete_by_fzf"
desc = "fzf 列表删书签"

[[mgr.prepend_keymap]]
on   = ["g", "r"]
run  = "plugin yamb -- rename_by_fzf"
desc = "fzf 列表重命名书签"

# 压缩选中文件/文件夹，c 开头（默认 zip，支持指定后缀如 7z/tar.gz）
[[mgr.prepend_keymap]]
on   = ["c", "a"]
run  = "plugin compress"
desc = "压缩选中文件"

[[mgr.prepend_keymap]]
on   = ["c", "p"]
run  = "plugin compress -p"
desc = "压缩选中文件（加密码）"
