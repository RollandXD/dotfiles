# ========== 基础设置 ==========

# 启用鼠标支持（滚轮直接查看历史）
set -g mouse on

# 启用 256 色支持
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 减少 Esc 延迟（Vim 用户必须）
set -sg escape-time 0

# 增大历史缓冲区
set -g history-limit 50000

# 显示消息时间延长
set -g display-time 3000
set -g display-panes-time 3000

# 状态栏消息时间
set -g message-style "bg=colour235,fg=colour166"

# ========== 窗口与面板编号 ==========
# 窗口编号从 1 开始（0 太远了）
set -g base-index 1

# 面板编号从 1 开始
setw -g pane-base-index 1

# 关闭窗口后自动重新编号
set -g renumber-windows on

# ========== 分屏快捷键 ==========
# 更直觉的分屏键
bind + split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 绑定大写的 H 和 L 来左右调换分屏位置（符合 Vim 直觉）
bind-key H swap-pane -U  # 往前/左调换
bind-key L swap-pane -D  # 往后/右调换

# 新建窗口时使用当前路径
bind c new-window -c "#{pane_current_path}"

# ========== 面板导航 ==========
# 用 hjkl 切换面板（Vim 风格）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-hjkl 交给 vim-tmux-navigator；先清掉旧的直接 pane 切换绑定。
unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l

# ========== 面板大小调整 ==========
# 用大写 HJKL 调整面板大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ========== 复制模式 (Vi 风格) ==========
# 开启 vi 键位
setw -g mode-keys vi

# v 开始选择，y 复制
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 快速进入复制模式
bind-key PageUp copy-mode -u
bind-key C-u copy-mode -u

# ========== 窗口切换 ==========
# Shift + 左右方向键切换窗口（无需前缀）
bind -n S-Left previous-window
bind -n S-Right next-window

# ========== 快捷操作 ==========
# r 重新加载配置文件
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 快速切换同步模式
bind S setw synchronize-panes \; display-message "Sync #{?pane_synchronized,ON,OFF}"

# ========== 状态栏美化 ==========
# 状态栏基本样式
set -g status-style "bg=colour235,fg=colour136"
set -g status-position bottom

# 左侧：会话名 + Prefix 指示器
set -g status-left-length 40
set -g status-left "#[fg=colour232,bg=colour154,bold] #S #[fg=colour154,bg=colour235] #{?client_prefix,#[fg=colour232]#[bg=colour196]#[bold] PREFIX ,}"

# 右侧：时间日期
set -g status-right-length 50
set -g status-right "#[fg=colour244] %Y-%m-%d #[fg=colour233,bg=colour244] %H:%M "

# 当前窗口样式
setw -g window-status-current-style "fg=colour232,bg=colour166,bold"
setw -g window-status-current-format " #I:#W#F "

# 非活跃窗口样式
setw -g window-status-style "fg=colour244,bg=colour235"
setw -g window-status-format " #I:#W#F "

# 面板边框颜色
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour166"

# ========== 活动通知 ==========
# 其他窗口有活动时高亮提示，并显示状态栏消息
setw -g monitor-activity on
set -g visual-activity on
set -g activity-action other

# 关闭 bell 类提醒，避免切换窗口时误响
setw -g monitor-bell off
set -g bell-action none
set -g visual-bell off
set -g visual-silence off

# ========== 桌面通知支持 ==========
# 透传 OSC 转义序列给宿主终端（仅少数终端支持，不作为主通知链路）
set -g allow-passthrough on

# tmux 新建窗口/session 时同步这些环境变量（Wayland 通知必须）
set -g update-environment "WAYLAND_DISPLAY DISPLAY DBUS_SESSION_BUS_ADDRESS DBUS_SESSION_BUS_PID"

# niri + dms: 直接走系统通知
set-hook -g alert-activity 'run-shell "notify-send -a tmux -u normal -h string:x-dunst-stack-tag:tmux-activity tmux-activity \"[#S:#I] #W\""'
set-hook -gu alert-silence

# ========== 插件 ==========
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"

# vim-tmux-navigator 默认用 Ctrl-hjkl；这里改成 Alt-hjkl，释放 Ctrl 组合。
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -n C-\\
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_down "M-j"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_prev ""
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @continuum-restore "on"

# TPM 需要放在最后加载
run "~/.tmux/plugins/tpm/tpm"
