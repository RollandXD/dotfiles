# Qt 平台主题：让 Qt 应用读取 qt6ct 的配色
# DMS 的 matugen 模板会把主题配色写到 ~/.config/qt6ct/colors/matugen.conf，
# 由 qt6ct 加载；没有这个变量，Qt 应用不会去读 qt6ct 的配置。
#
# 放在 environment.d 而不是 niri 的 environment{} 块，是因为两者覆盖的启动路径不同：
#   - niri 的 environment{} 只对 niri spawn 的进程生效
#   - systemd user service（如 Clash Verge、Nutstore 的 @autostart 服务）继承的是
#     systemd 用户环境，即本目录
QT_QPA_PLATFORMTHEME=qt6ct
