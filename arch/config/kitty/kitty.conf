include dank-tabs.conf
include catppuccin-frappe.conf
window_padding_width 5
hide_window_decorations yes
background_opacity 0.95
font_family JetBrainsMono Nerd Font Mono
font_size 11.0
symbol_map U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF Maple Mono NF CN
symbol_map U+3000-U+303F,U+FF00-U+FFEF Noto Sans Mono CJK SC
# Claude Code 的 todo(◻◼) / plan mode(⏸) 图标：默认回退到 Noto Color Emoji 会被裁成半截
symbol_map U+23E9-U+23FA,U+25FB-U+25FE Adwaita Mono
# 其余"文本默认呈现"的 emoji 字符（✳❤✈⚙ℹ…）同样会被 kitty 回退到彩色 emoji 并裁半；2026-10-08 用 fc 扫描生成
symbol_map U+23CF,U+2604,U+2618,U+2620,U+2622-U+2623,U+26C8,U+26CF,U+26D1,U+26D3,U+2708-U+2709,U+270C-U+270D,U+270F,U+2712,U+2733-U+2734,U+2744,U+2747,U+2763-U+2764,U+1F321,U+1F324-U+1F32C,U+1F336,U+1F37D,U+1F396-U+1F397,U+1F399-U+1F39B,U+1F39E-U+1F39F,U+1F3CB-U+1F3CE,U+1F3D4-U+1F3DF,U+1F3F3,U+1F3F5,U+1F3F7,U+1F43F,U+1F441,U+1F4FD,U+1F54A,U+1F56F-U+1F570,U+1F573-U+1F579,U+1F587,U+1F58A-U+1F58D,U+1F590,U+1F5A5,U+1F5A8,U+1F5B1-U+1F5B2,U+1F5BC,U+1F5C2-U+1F5C4,U+1F5D1-U+1F5D3,U+1F5DC-U+1F5DE,U+1F5E1,U+1F5E3,U+1F5E8,U+1F5EF,U+1F5F3,U+1F5FA,U+1F6CB,U+1F6CD-U+1F6CF,U+1F6E0-U+1F6E5,U+1F6E9,U+1F6F0,U+1F6F3 Noto Sans Symbols 2
symbol_map U+2139,U+2626,U+262A,U+262E,U+2638-U+263A,U+267E,U+2692,U+2694-U+2697,U+2699,U+269B-U+269C,U+26A7,U+26B0-U+26B1,U+26E9,U+26F0-U+26F1,U+26F4,U+26F7-U+26F9,U+271D,U+2721,U+1F549 Segoe UI Symbol
remember_window_size no
confirm_os_window_close 0
shell zsh
cursor_trail 1 
cursor_shape block
shell_integration no-cursor


# BEL 走统一提示音播放器；关闭内置音频铃声，避免重复播放。
enable_audio_bell no
command_on_bell /home/rolland/.local/bin/system-sounds play bell

# 英文随查：仅允许读取当前选区，禁止其他远程操作。新开的 Kitty 生效。
allow_remote_control password
remote_control_password "" kitty_selection_auth.py
listen_on unix:${XDG_RUNTIME_DIR}/english-lookup-kitty-{kitty_pid}
