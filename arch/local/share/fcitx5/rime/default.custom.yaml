patch:
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Shift_L: noop
      Shift_R: noop
      Control_L: noop
      Control_R: noop
      Caps_Lock: noop
  schema_list:
    - schema: rime_ice
    - schema: luna_pinyin_simp
    - schema: double_pinyin_flypy
    - schema: bopomofo
  "menu/page_size": 6
  key_binder/bindings/+:
    - { when: composing, accept: "Control+space", send: Escape }
    # 有候选时 ; 选第二个、' 选第三个（代价：打字途中 ' 不再用作拼音分隔符）
    - { when: has_menu, accept: semicolon, send: 2 }
    - { when: has_menu, accept: apostrophe, send: 3 }
  # 以词定字：候选词状态下 [ 上屏首字、] 上屏末字（雾凇 select_character.lua）
  key_binder/select_first_character: "bracketleft"
  key_binder/select_last_character: "bracketright"
