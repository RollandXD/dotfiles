# ========== 基础设置 ==========

# 启用鼠标支持（滚轮直接查看历史）
set -g mouse on

# 启用 256 色 + TrueColor 支持
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -ga terminal-features ",xterm*:extkeys"
set -s extended-keys on

# 启用 OSC52 / 系统剪贴板整合
set -s set-clipboard on

# 减少 Esc 延迟（Vim 用户必须）
set -sg escape-time 0

# 增大历史缓冲区
set -g history-limit 50000

# 显示消息时间延长
set -g display-time 3000
set -g display-panes-time 3000

# ========== Prefix ==========
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# 状态栏消息时间
set -g message-style "bg=colour235,fg=colour166"

# ========== 窗口与面板编号 ==========
# 窗口编号从 1 开始（0 太远了）
set -g base-index 1

# 面板编号从 1 开始
setw -g pane-base-index 1

# 关闭窗口后自动重新编号
set -g renumber-windows on

# ========== 分屏快捷键 ==========
# 更直觉的分屏键
bind + split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 用 < / > 调换当前 pane 的位置，避免和 HJKL 调整大小冲突
bind-key < swap-pane -U  # 往前/左调换
bind-key > swap-pane -D  # 往后/右调换

# 新建窗口时使用当前路径
bind c new-window -c "#{pane_current_path}"

# ========== 面板导航 ==========
# 用 hjkl 切换面板（Vim 风格）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt-hjkl 交给 vim-tmux-navigator；先清掉旧的直接 pane 切换绑定。
unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l

# ========== 面板大小调整 ==========
# 用大写 HJKL 调整面板大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ========== 复制模式 (Vi 风格) ==========
# 开启 vi 键位
setw -g mode-keys vi

# v 开始选择，y 复制
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# 快速进入复制模式
bind-key PageUp copy-mode -u
bind-key C-u copy-mode -u

# ========== 窗口切换 ==========
# 取消 Shift + 左右方向键的窗口切换绑定
unbind -n S-Left
unbind -n S-Right

# Alt + Shift + 左右方向键交换当前窗口的位置（无需前缀）
bind -n M-S-Left swap-window -t -1
bind -n M-S-Right swap-window -t +1

# Alt + 数字直接切到对应窗口（1-9）
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# ========== 快捷操作 ==========
# r 重新加载配置文件
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 快速切换同步模式
bind S setw synchronize-panes \; display-message "Sync #{?pane_synchronized,ON,OFF}"

# 实用快捷操作
bind a last-window
bind T choose-window "join-pane -h -s '%%'"
bind Q confirm-before -p "Kill session #S? (y/n)" kill-session
bind N new-session

# ========== Catppuccin 主题 ==========
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_left_separator " "
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator " "
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_status_background "default"

# 两端状态模块用圆弧 powerline 分隔符(catppuccin 默认左圆弧 U+E0B6)，
# connect=yes + right_separator 留空：相邻模块无缝相连，下一个模块的左圆弧
# 直接从上一个模块的背景里"长出来"(powerline 风格)，而不是被透明空格割裂。
# 注意：必须在 catppuccin.tmux 的 run 之前设置(模块串在 run 时一次性拼接)。
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "yes"


# 手动加载 Catppuccin，后面再接上自定义状态栏
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Catppuccin 默认的 choose-tree/copy-mode 选中行偏暗；在透明/背景图终端里不够清楚。
set -gF mode-style "fg=#{@thm_crust},bg=#{@thm_yellow},bold"
set -g @catppuccin_menu_selected_style "fg=#{@thm_crust},bg=#{@thm_yellow},bold"
set -gF menu-selected-style "fg=#{@thm_crust},bg=#{@thm_yellow},bold"
set -gF popup-border-style "fg=#{@thm_lavender}"

# ========== 状态栏美化 ==========
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100

# 左侧：session 名。catppuccin session 模块自带 prefix 感知——
# 平时绿色显示 session 名，按下 prefix(C-b) 时整块变红。
set -g status-left ""
set -ga status-left "#{E:@catppuccin_status_session}"

# 右侧：git 状态(gitmux，非 git 目录整块隐藏) + 当前目录(basename)。
# 日期时间模块如需恢复，取消下面注释即可。
set -g status-right ""
set -ga status-right "#{?#{!=:#(gitmux -cfg ~/.gitmux.conf \"#{pane_current_path}\"),},#{E:@catppuccin_status_gitmux},}"
set -ga status-right "#{E:@catppuccin_status_directory}"
# set -ga status-right "#{E:@catppuccin_status_date_time}"

# ========== 活动通知 ==========
# 关闭 activity 提示，避免出现 "activity in window X" 消息
setw -g monitor-activity off
set -g visual-activity off
set -g activity-action none

# 关闭 bell 类提醒，避免切换窗口时误响
setw -g monitor-bell off
set -g bell-action none
set -g visual-bell off
set -g visual-silence off

# ========== 桌面通知支持 ==========
# 透传 OSC 转义序列给宿主终端（仅少数终端支持，不作为主通知链路）
set -g allow-passthrough all

# 让 OpenCode 等终端程序获知 pane/终端焦点变化
set -g focus-events on

# tmux 新建窗口/session 时同步这些环境变量（Wayland 通知必须）
set -g update-environment "WAYLAND_DISPLAY DISPLAY DBUS_SESSION_BUS_ADDRESS DBUS_SESSION_BUS_PID TERM_PROGRAM"

# niri + dms: 直接走系统通知
# set-hook -g alert-activity 'run-shell "notify-send -a tmux -u normal -h string:x-dunst-stack-tag:tmux-activity tmux-activity \"[#S:#I] #W\""'
set-hook -gu alert-silence

# ========== 插件 ==========
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"

# vim-tmux-navigator 默认用 Ctrl-hjkl；这里改成 Alt-hjkl，释放 Ctrl 组合。
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -n C-\\
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_down "M-j"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_prev ""
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @continuum-restore "on"

# fzf 驱动的 session 管理器：默认 prefix+O 打开
# (内置 ctrl-f 调 zoxide 列表新建 session，ctrl-w 窗口模式，ctrl-r 重命名，alt-bspace 杀 session)
set -g @plugin "omerxx/tmux-sessionx"

# 屏幕文本(路径/URL/hash 等)字母标注快速复制：默认 prefix+Space
# 会覆盖内置 next-layout(手动分屏布局下基本不用，故保留默认键)
set -g @plugin "fcsonline/tmux-thumbs"

# fzf 弹出菜单管理 window/pane/session：默认 prefix+F(大写，与 find-window 的 prefix+f 不冲突)
set -g @plugin "sainnhe/tmux-fzf"

# TPM 需要放在最后加载
run "~/.tmux/plugins/tpm/tpm"

# Pi: use the CSI-u extended key format
set -g extended-keys-format csi-u
