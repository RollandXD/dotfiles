# keyd 改键配置，安装位置：/etc/keyd/default.conf
# 改完执行 sudo keyd reload；写坏时同时按 Backspace+Escape+Enter 强制退出 keyd

[ids]
*

[main]
# 大写键当 Ctrl（Esc 用 Ctrl+[）
capslock = layer(control)
# 原左 Ctrl 腾出来当导航层键（右 Ctrl 仍是 Ctrl）
leftcontrol = layer(nav)

# Ctrl+[ 当 Esc（Vim 习惯，所有程序通用；大写键和右 Ctrl 都算 Ctrl）
[control]
leftbrace = esc

# 按住左 Ctrl 时生效；可叠加 Shift 选中文字
[nav]
h = left
j = down
k = up
l = right
y = home
o = end
u = pageup
i = pagedown
b = C-left
f = C-right
n = backspace
m = delete
w = C-backspace
